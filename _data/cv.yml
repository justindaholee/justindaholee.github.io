Experiences:
 - company: Andre Berndt Lab
   link: http://berndtlab.com
   position: Graduate Student
   dates: April 2018 - current
   summary: Berndt lab is a molecular design lab which develops fluorescent biosensors for detecting biochemical signals in neuronal networks in real time. Our goal is to monitor the activity of neurotransmitter, neuromodulators, hormones, ions and intracellular signaling molecules in live tissue and behaving animals at high spatial and temporal resolution. We aim to use these tools to identify impaired network dynamics in animal models for neurological disorders which will close critical knowledge gaps in our understanding of diseases such as autism and epilepsy.
   Responsibilites:
    - Responsibilites: Structure-guided protein design of genetically encoded GCaMP-type GPCR fluorescent indicators.
    - Responsibilites: Development of high-throughput protein engineering pipeline.
    - Responsibilites: Optogenetic modeling and rescue of neuropathological brain states in zebrafish.
    - Responsibilites: Social behavior and neural circuits in zebrafish.
 - company: NanoSurface Biomedical Inc
   link: http://nanosurfacebio.com
   position: Cofounder
   dates: March 2015 - March 2018
   summary: NanoSurface Biomedical(NSB) provides products and services for drug development, disease modeling, and fundamental research into cell biology. NanoSurface culture products imitate the native extracellular matrix, and structure cultured cells into physiologically relevant tissue models. NSB was spin-off from technologies developed in Deok-Ho Kim's Lab.
   Responsibilites:
    - Responsibilites: NanoSurface Biomedical brings nanotopography to various in vitro system to re- capitulate micro cellular environment that enables more ”physiological” cell/tissue culture.
    - Responsibilites: As a head of technology, successfully launched first product line ”ANFS”
    - Responsibilites: Transition from management role to consulting role to focus on MS degree(2016)
    - Responsibilites: Academic collaboration to develop stretchable chamber with Extracellular Matrix mimicking nanotexture (2018)
 - company: Deok-Ho Kim Lab
   link: https://openwetware.org/wiki/Kim
   position: Research Scientist
   dates: Jan 2012 - March 2018
   summary: Kim Lab's research spans the disciplinary boundaries between nanotechnology, biomaterials, and mechanobiology with an emphasis on their applications to tissue engineering and regenerative medicine. Through the use of multi-scale (nano/micro/meso) fabrication and integration tools, Kim Lab focus on the development and application of bio-inspired materials/devices and functional tissue engineering models for elucidating regenerative biology, drug screening, disease modeling, and stem cell-based therapies.
   Responsibilites:
    - Responsibilites: Combinatorial maturation of iPSC derived skeletal muscle cell - nanotopography and mechanical stretching
    - Responsibilites: iPSC myogenic differentiation
    - Responsibilites: Tissue engineered human neuromuscular junctions for study of CMT II pathophysiology
    - Responsibilites: Graphene-based multifunctional nanomaterials for cardiac tissue and stem cell Engineering
    - Responsibilites: Biomimetically nano-textured micro electrode array device for drug-induced cardiotoxicity screening
    - Responsibilites: Biocompatible transparent substrate for corneal epithelial cell migration enhancement
    - Responsibilites: Mathematical modeling of transfer of intercellular cytoplasmic proteins
    - Responsibilites: Thermoresponsive nanofabricated substratum for the engineering of three dimensional tissues with layer-by-layer architectural control
    - Responsibilites: Synergistic effects of topography and rigidity difference on human umbilical smooth muscle cell
    - Responsibilites: Multiscale device fabrication manager
    - Responsibilites: Mentored undergraduate students and volunteers

